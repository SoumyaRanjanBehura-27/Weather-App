<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Auth Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style style="text/css">
        body {
            font-family: 'Inter', sans-serif;
        }
        /* Custom glassmorphism styling and smooth transitions */
        .glass-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }
        .dark .glass-card {
            background: rgba(17, 24, 39, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .form-transition {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        /* Background animated gradient circles */
        @keyframes float {
            0%, 100% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-20px) scale(1.05); }
        }
        .animate-float-slow {
            animation: float 8s ease-in-out infinite;
        }
        .animate-float-delayed {
            animation: float 10s ease-in-out infinite 2s;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4 relative overflow-x-hidden transition-colors duration-300" id="bodyRoot">

    <!-- Ambient Background Gradients -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float-slow pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-indigo-500 rounded-full mix-blend-multiply filter blur-3xl opacity-30 animate-float-delayed pointer-events-none"></div>
    <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-96 h-96 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-25 pointer-events-none"></div>

    <!-- Theme & Notifications Top Bar -->
    <div class="absolute top-6 right-6 flex items-center space-x-3 z-20">
        <button onclick="toggleTheme()" class="glass-card p-3 rounded-full hover:bg-white/20 transition text-slate-200 shadow-lg" title="Toggle Theme">
            <i id="themeIcon" class="fa-solid fa-moon"></i>
        </button>
    </div>

    <!-- Main Container -->
    <div class="w-full max-w-md z-10">
        
        <!-- Toast Notification Box -->
        <div id="toast" class="mb-4 p-4 rounded-xl glass-card text-sm flex items-center justify-between opacity-0 translate-y-[-10px] pointer-events-none transition-all duration-300 shadow-xl">
            <span id="toastMessage" class="font-medium"></span>
            <button onclick="hideToast()" class="text-slate-400 hover:text-white ml-2"><i class="fa-solid fa-xmark"></i></button>
        </div>

        <!-- Auth Card Wrapper -->
        <div class="glass-card rounded-3xl p-8 shadow-2xl relative overflow-hidden form-transition">
            
            <!-- Header Section -->
            <div class="text-center mb-8">
                <div class="inline-flex items-center justify-center w-16 h-16 rounded-2xl bg-gradient-to-tr from-indigo-500 to-pink-500 text-white text-2xl shadow-lg mb-4">
                    <i id="headerIcon" class="fa-solid fa-shield-halved"></i>
                </div>
                <h1 id="formTitle" class="text-2xl font-bold tracking-tight text-white">Welcome Back</h1>
                <p id="formSubtitle" class="text-sm text-slate-300 mt-1">Please enter your details to sign in</p>
            </div>

            <!-- Auth Form -->
            <form id="authForm" onsubmit="handleFormSubmit(event)" class="space-y-4" novalidate>
                
                <!-- Name Field (Visible only on Sign Up) -->
                <div id="nameFieldContainer" class="space-y-1 hidden opacity-0 form-transition">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-300">Full Name</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-regular fa-user"></i>
                        </span>
                        <input type="text" id="fullName" placeholder="John Doe" 
                            class="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-800/40 border border-slate-700/50 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm form-transition">
                    </div>
                    <p id="nameError" class="text-xs text-rose-400 hidden mt-1"></p>
                </div>

                <!-- Email Field -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-300">Email Address</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-regular fa-envelope"></i>
                        </span>
                        <input type="email" id="email" placeholder="name@example.com" required
                            class="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-800/40 border border-slate-700/50 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm form-transition">
                    </div>
                    <p id="emailError" class="text-xs text-rose-400 hidden mt-1"></p>
                </div>

                <!-- Password Field -->
                <div class="space-y-1">
                    <label class="text-xs font-semibold uppercase tracking-wider text-slate-300">Password</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-4 text-slate-400">
                            <i class="fa-solid fa-lock"></i>
                        </span>
                        <input type="password" id="password" placeholder="••••••••" required
                            class="w-full pl-11 pr-12 py-3 rounded-xl bg-slate-800/40 border border-slate-700/50 text-white placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-500/20 text-sm form-transition">
                        <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 right-0 flex items-center pr-4 text-slate-400 hover:text-white transition">
                            <i id="eyeIcon" class="fa-regular fa-eye"></i>
                        </button>
                    </div>
                    <p id="passwordError" class="text-xs text-rose-400 hidden mt-1"></p>
                </div>

                <!-- Remember Me & Forgot Password (Login Mode Only) -->
                <div id="extraOptions" class="flex items-center justify-between text-xs text-slate-300 pt-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="rememberMe" class="w-4 h-4 rounded bg-slate-800 border-slate-700 text-indigo-600 focus:ring-indigo-500/30 accent-indigo-500">
                        <span>Remember me</span>
                    </label>
                    <a href="#" onclick="handleForgotPassword(event)" class="text-indigo-400 hover:text-indigo-300 font-medium transition">Forgot password?</a>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full mt-4 py-3 px-4 bg-gradient-to-r from-indigo-600 to-pink-600 hover:from-indigo-500 hover:to-pink-500 text-white font-semibold rounded-xl shadow-lg shadow-indigo-600/30 transition-all duration-300 transform active:scale-[0.98] text-sm">
                    Sign In
                </button>
            </form>

            <!-- Divider -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-slate-700/60"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-slate-900/60 px-3 text-slate-400 rounded-full">Or continue with</span></div>
            </div>

            <!-- Social Logins -->
            <div class="grid grid-cols-2 gap-3">
                <button onclick="handleSocialLogin('Google')" class="flex items-center justify-center py-2.5 px-4 rounded-xl glass-card hover:bg-white/20 text-slate-200 text-xs font-semibold transition space-x-2 shadow-md">
                    <i class="fa-brands fa-google text-rose-400 text-base"></i>
                    <span>Google</span>
                </button>
                <button onclick="handleSocialLogin('GitHub')" class="flex items-center justify-center py-2.5 px-4 rounded-xl glass-card hover:bg-white/20 text-slate-200 text-xs font-semibold transition space-x-2 shadow-md">
                    <i class="fa-brands fa-github text-white text-base"></i>
                    <span>GitHub</span>
                </button>
            </div>

            <!-- Mode Switcher Footer -->
            <div class="text-center mt-6 text-xs text-slate-300">
                <span id="switchText">Don't have an account?</span>
                <button type="button" onclick="toggleAuthMode()" id="switchBtn" class="text-indigo-400 font-semibold hover:underline ml-1">Sign up</button>
            </div>

        </div>
    </div>

    <!-- JavaScript Logic -->
    <script type="text/javascript">
        // State Management
        let isLoginMode = true;

        /**
         * Toggles between Login and Sign Up modes with smooth UI updates
         */
        function toggleAuthMode() {
            isLoginMode = !isLoginMode;
            const formTitle = document.getElementById('formTitle');
            const formSubtitle = document.getElementById('formSubtitle');
            const submitBtn = document.getElementById('submitBtn');
            const switchText = document.getElementById('switchText');
            const switchBtn = document.getElementById('switchBtn');
            const nameFieldContainer = document.getElementById('nameFieldContainer');
            const extraOptions = document.getElementById('extraOptions');
            const headerIcon = document.getElementById('headerIcon');

            if (!isLoginMode) {
                // Switch to Sign Up
                formTitle.textContent = "Create Account";
                formSubtitle.textContent = "Join us today by filling out the details below";
                submitBtn.textContent = "Create Account";
                switchText.textContent = "Already have an account?";
                switchBtn.textContent = "Sign in";
                headerIcon.className = "fa-solid fa-user-plus";
                
                nameFieldContainer.classList.remove('hidden');
                setTimeout(() => nameFieldContainer.classList.remove('opacity-0'), 10);
                extraOptions.classList.add('hidden');
            } else {
                // Switch to Login
                formTitle.textContent = "Welcome Back";
                formSubtitle.textContent = "Please enter your details to sign in";
                submitBtn.textContent = "Sign In";
                switchText.textContent = "Don't have an account?";
                switchBtn.textContent = "Sign up";
                headerIcon.className = "fa-solid fa-shield-halved";

                nameFieldContainer.classList.add('opacity-0');
                setTimeout(() => nameFieldContainer.classList.add('hidden'), 300);
                extraOptions.classList.remove('hidden');
            }
            
            // Clear errors on switch
            clearErrors();
        }

        /**
         * Toggles password field visibility
         */
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.className = "fa-regular fa-eye-slash";
            } else {
                passwordInput.type = 'password';
                eyeIcon.className = "fa-regular fa-eye";
            }
        }

        /**
         * Form Validation logic adhering to robust checks
         */
        function validateForm(email, password, fullName = '') {
            let isValid = true;
            clearErrors();

            // Email validation regex
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email) {
                showFieldError('email', 'Email address is required.');
                isValid = false;
            } else if (!emailRegex.test(email)) {
                showFieldError('email', 'Please enter a valid email address.');
                isValid = false;
            }

            // Password validation
            if (!password) {
                showFieldError('password', 'Password is required.');
                isValid = false;
            } else if (password.length < 6) {
                showFieldError('password', 'Password must be at least 6 characters long.');
                isValid = false;
            }

            // Sign Up specific validation
            if (!isLoginMode) {
                if (!fullName.trim()) {
                    showFieldError('name', 'Full name is required.');
                    isValid = false;
                }
            }

            return isValid;
        }

        /**
         * Displays field specific error message
         */
        function showFieldError(field, message) {
            const errorElement = document.getElementById(field + 'Error');
            const inputElement = document.getElementById(field === 'name' ? 'fullName' : field);
            if (errorElement && inputElement) {
                errorElement.textContent = message;
                errorElement.classList.remove('hidden');
                inputElement.classList.add('border-rose-500', 'focus:border-rose-500', 'focus:ring-rose-500/20');
            }
        }

        /**
         * Clears all validation errors
         */
        function clearErrors() {
            ['email', 'password', 'name'].forEach(field => {
                const errorElement = document.getElementById(field + 'Error');
                const inputElement = document.getElementById(field === 'name' ? 'fullName' : field);
                if (errorElement && inputElement) {
                    errorElement.textContent = '';
                    errorElement.classList.add('hidden');
                    inputElement.classList.remove('border-rose-500', 'focus:border-rose-500', 'focus:ring-rose-500/20');
                }
            });
        }

        /**
         * Main form submit dispatcher
         */
        function handleFormSubmit(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const fullName = document.getElementById('fullName').value.trim();

            if (validateForm(email, password, fullName)) {
                if (isLoginMode) {
                    handleLogin(email, password);
                } else {
                    handleSignup(fullName, email, password);
                }
            }
        }

        /**
         * Handles User Login execution
         */
        function handleLogin(email, password) {
            const rememberMe = document.getElementById('rememberMe').checked;
            showToast(`Successfully logged in as ${email}!`, 'success');
            console.log('Login Payload:', { email, password, rememberMe });
            // Add custom authentication API integration here
        }

        /**
         * Handles User Sign Up execution
         */
        function handleSignup(fullName, email, password) {
            showToast(`Account successfully created for ${fullName}!`, 'success');
            console.log('Signup Payload:', { fullName, email, password });
            // Switch back to login or auto-login after successful registration
            setTimeout(() => toggleAuthMode(), 1500);
        }

        /**
         * Handles Social Login callbacks
         */
        function handleSocialLogin(provider) {
            showToast(`Redirecting to ${provider} authentication...`, 'info');
            console.log(`Initiating ${provider} OAuth flow.`);
        }

        /**
         * Handles forgot password flow
         */
        function handleForgotPassword(event) {
            event.preventDefault();
            const email = document.getElementById('email').value.trim();
            if (!email) {
                showFieldError('email', 'Please enter your email address first.');
                return;
            }
            showToast(`Password reset link sent to ${email}`, 'success');
        }

        /**
         * Toast notification helper replacing browser alerts
         */
        function showToast(message, type = 'success') {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;
            
            toast.classList.remove('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');

            setTimeout(() => {
                hideToast();
            }, 4000);
        }

        function hideToast() {
            const toast = document.getElementById('toast');
            toast.classList.add('opacity-0', 'translate-y-[-10px]', 'pointer-events-none');
            toast.classList.remove('opacity-100', 'translate-y-0');
        }

        /**
         * Theme toggling between dark and light glassmorphism
         */
        function toggleTheme() {
            const body = document.getElementById('bodyRoot');
            const themeIcon = document.getElementById('themeIcon');
            body.classList.toggle('dark');
            body.classList.toggle('bg-slate-900');
            body.classList.toggle('bg-slate-100');
            
            if (body.classList.contains('dark')) {
                themeIcon.className = "fa-solid fa-moon";
            } else {
                themeIcon.className = "fa-solid fa-sun";
            }
        }
    </script>
</body>
</html>
