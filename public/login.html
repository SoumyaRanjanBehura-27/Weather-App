<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Responsive Login Page</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" rel="stylesheet">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style type="text/css">
        /* Base Styling & Theme Variables */
        :root {
            --primary-gradient: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
            --background-gradient: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            --glass-bg: rgba(255, 255, 255, 0.95);
            --card-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --text-main: #1e293b;
            --text-muted: #64748b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--background-gradient);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 1.5rem 1rem;
            color: var(--text-main);
        }

        /* Glassmorphism Wrapper Card */
        .login-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            border-radius: 1.25rem;
            box-shadow: var(--card-shadow);
            width: 100%;
            max-width: 440px;
            padding: 2.5rem 2rem;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .login-header .logo-icon {
            width: 52px;
            height: 52px;
            background: var(--primary-gradient);
            color: #ffffff;
            border-radius: 12px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            margin-bottom: 1rem;
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.3);
        }

        .login-header h2 {
            font-weight: 700;
            color: var(--text-main);
            font-size: 1.65rem;
            margin-bottom: 0.25rem;
        }

        .login-header p {
            color: var(--text-muted);
            font-size: 0.9rem;
        }

        /* Input Controls and Icons */
        .input-group-custom {
            position: relative;
            margin-bottom: 1.25rem;
        }

        .form-control-custom {
            width: 100%;
            padding: 0.75rem 2.75rem 0.75rem 2.75rem;
            font-size: 0.95rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 0.75rem;
            background-color: #f8fafc;
            color: var(--text-main);
            transition: all 0.2s ease-in-out;
        }

        .form-control-custom:focus {
            outline: none;
            border-color: var(--primary-color);
            background-color: #ffffff;
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.1);
        }

        .input-icon-left {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            font-size: 1.1rem;
            pointer-events: none;
            transition: color 0.2s ease;
        }

        .toggle-password {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: #94a3b8;
            cursor: pointer;
            font-size: 1.1rem;
            border: none;
            background: none;
            padding: 0;
            transition: color 0.2s ease;
        }

        .toggle-password:hover {
            color: var(--primary-color);
        }

        /* Focus state styling for icon */
        .form-control-custom:focus ~ .input-icon-left {
            color: var(--primary-color);
        }

        /* Validation feedback messaging */
        .invalid-feedback-custom {
            display: none;
            font-size: 0.8rem;
            color: #ef4444;
            margin-top: 0.35rem;
            margin-left: 0.25rem;
        }

        .has-error .form-control-custom {
            border-color: #ef4444 !important;
            background-color: #fef2f2;
        }

        .has-error .invalid-feedback-custom {
            display: block;
        }

        /* Submit Button Styling */
        .btn-submit {
            background: var(--primary-gradient);
            color: #ffffff;
            border: none;
            width: 100%;
            padding: 0.8rem;
            font-weight: 600;
            font-size: 1rem;
            border-radius: 0.75rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            transition: all 0.2s ease-in-out;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit:hover {
            opacity: 0.95;
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        /* Divider */
        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e2e8f0;
        }

        .divider span {
            padding: 0 0.75rem;
            font-weight: 500;
        }

        /* Social Login Buttons */
        .social-btns {
            display: flex;
            gap: 0.75rem;
        }

        .btn-social {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            padding: 0.65rem;
            border: 1.5px solid #e2e8f0;
            border-radius: 0.75rem;
            background-color: #ffffff;
            color: var(--text-main);
            font-size: 0.9rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .btn-social:hover {
            background-color: #f8fafc;
            border-color: #cbd5e1;
            transform: translateY(-1px);
        }

        /* Toast Container Customization */
        .toast-container {
            position: fixed;
            top: 1.25rem;
            right: 1.25rem;
            z-index: 1080;
        }

        .custom-toast {
            border-radius: 0.75rem;
            border: none;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }
    </style>
</head>
<body>

    <!-- Main Container -->
    <main class="login-card">
        <!-- Header -->
        <header class="login-header">
            <div class="logo-icon">
                <i class="fa-solid fa-lock"></i>
            </div>
            <h2>Welcome Back</h2>
            <p>Please enter your details to sign in</p>
        </header>

        <!-- Login Form -->
        <form id="loginForm" novalidate>
            <!-- Email Input -->
            <div class="input-group-custom" id="emailGroup">
                <input 
                    type="email" 
                    id="email" 
                    class="form-control-custom" 
                    placeholder="Email address"
                    autocomplete="email"
                >
                <i class="fa-regular fa-envelope input-icon-left"></i>
                <div class="invalid-feedback-custom" id="emailFeedback">
                    Please enter a valid email address.
                </div>
            </div>

            <!-- Password Input -->
            <div class="input-group-custom" id="passwordGroup">
                <input 
                    type="password" 
                    id="password" 
                    class="form-control-custom" 
                    placeholder="Password"
                    autocomplete="current-password"
                >
                <i class="fa-solid fa-key input-icon-left"></i>
                <button type="button" class="toggle-password" id="togglePasswordBtn" aria-label="Toggle password visibility">
                    <i class="fa-regular fa-eye" id="toggleIcon"></i>
                </button>
                <div class="invalid-feedback-custom" id="passwordFeedback">
                    Password is required.
                </div>
            </div>

            <!-- Remember Me & Forgot Password -->
            <div class="d-flex align-items-center justify-content-between mb-4 fs-7">
                <div class="form-check m-0">
                    <input class="form-check-input" type="checkbox" id="rememberMe">
                    <label class="form-check-label text-secondary small fw-medium" for="rememberMe">
                        Remember me
                    </label>
                </div>
                <a href="#" class="text-decoration-none small fw-semibold" style="color: var(--primary-color);" id="forgotPasswordLink">
                    Forgot password?
                </a>
            </div>

            <!-- Submit Button -->
            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="btnText">Sign In</span>
                <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
            </button>
        </form>

        <!-- Divider -->
        <div class="divider">
            <span>Or continue with</span>
        </div>

        <!-- Social Logins -->
        <div class="social-btns">
            <button class="btn-social" type="button" onclick="handleSocialLogin('Google')">
                <i class="fa-brands fa-google text-danger"></i>
                Google
            </button>
            <button class="btn-social" type="button" onclick="handleSocialLogin('GitHub')">
                <i class="fa-brands fa-github"></i>
                GitHub
            </button>
        </div>

        <!-- Signup Prompt -->
        <p class="text-center small text-secondary mt-4 mb-0">
            Don't have an account? 
            <a href="#" class="fw-semibold text-decoration-none" style="color: var(--primary-color);">Sign up</a>
        </p>
    </main>

    <!-- Toast Notification Container -->
    <div class="toast-container">
        <div id="liveToast" class="toast custom-toast align-items-center text-white bg-dark border-0" role="alert" aria-live="assertive" aria-atomic="true">
            <div class="d-flex">
                <div class="toast-body d-flex align-items-center gap-2">
                    <i id="toastIcon" class="fa-solid fa-circle-check text-success"></i>
                    <span id="toastMessage">Logged in successfully!</span>
                </div>
                <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close"></button>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Interactive Script -->
    <script type="text/javascript">
        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const emailInput = document.getElementById('email');
            const passwordInput = document.getElementById('password');
            const emailGroup = document.getElementById('emailGroup');
            const passwordGroup = document.getElementById('passwordGroup');
            const togglePasswordBtn = document.getElementById('togglePasswordBtn');
            const toggleIcon = document.getElementById('toggleIcon');
            const submitBtn = document.getElementById('submitBtn');
            const btnText = document.getElementById('btnText');
            const btnSpinner = document.getElementById('btnSpinner');
            const forgotPasswordLink = document.getElementById('forgotPasswordLink');

            // Initialize Bootstrap Toast
            const toastEl = document.getElementById('liveToast');
            const toast = new bootstrap.Toast(toastEl, { delay: 4000 });
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            // Toggle Password Visibility
            togglePasswordBtn.addEventListener('click', () => {
                const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                passwordInput.setAttribute('type', type);
                
                // Toggle Icon
                if (type === 'text') {
                    toggleIcon.classList.remove('fa-eye');
                    toggleIcon.classList.add('fa-eye-slash');
                } else {
                    toggleIcon.classList.remove('fa-eye-slash');
                    toggleIcon.classList.add('fa-eye');
                }
            });

            // Email Validation Helper
            const isValidEmail = (email) => {
                const re = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                return re.test(String(email).toLowerCase());
            };

            // Real-time Input Validation Cleaners
            emailInput.addEventListener('input', () => {
                if (emailInput.value.trim() !== '') {
                    emailGroup.classList.remove('has-error');
                }
            });

            passwordInput.addEventListener('input', () => {
                if (passwordInput.value.trim() !== '') {
                    passwordGroup.classList.remove('has-error');
                }
            });

            // Form Submit Event Handler
            loginForm.addEventListener('submit', (e) => {
                e.preventDefault();
                let valid = true;

                const emailValue = emailInput.value.trim();
                const passwordValue = passwordInput.value.trim();

                // Email Validation
                if (!emailValue || !isValidEmail(emailValue)) {
                    emailGroup.classList.add('has-error');
                    valid = false;
                } else {
                    emailGroup.classList.remove('has-error');
                }

                // Password Validation
                if (!passwordValue) {
                    passwordGroup.classList.add('has-error');
                    valid = false;
                } else {
                    passwordGroup.classList.remove('has-error');
                }

                if (!valid) return;

                // Simulate Loading state
                setLoadingState(true);

                // Simulate Async Network Request
                setTimeout(() => {
                    setLoadingState(false);
                    showToast('Successfully signed in! Redirecting...', 'success');
                    loginForm.reset();
                }, 1500);
            });

            // Button Loading State Trigger
            function setLoadingState(isLoading) {
                if (isLoading) {
                    submitBtn.disabled = true;
                    btnText.textContent = 'Signing in...';
                    btnSpinner.classList.remove('d-none');
                } else {
                    submitBtn.disabled = false;
                    btnText.textContent = 'Sign In';
                    btnSpinner.classList.add('d-none');
                }
            }

            // Toast Helper Function
            window.showToast = function(message, type = 'success') {
                toastMessage.textContent = message;
                if (type === 'success') {
                    toastIcon.className = 'fa-solid fa-circle-check text-success';
                } else if (type === 'info') {
                    toastIcon.className = 'fa-solid fa-circle-info text-info';
                } else {
                    toastIcon.className = 'fa-solid fa-circle-exclamation text-danger';
                }
                toast.show();
            };

            // Social Login Dummy Handler
            window.handleSocialLogin = function(provider) {
                showToast(`Connecting to ${provider}...`, 'info');
            };

            // Forgot Password Dummy Handler
            forgotPasswordLink.addEventListener('click', (e) => {
                e.preventDefault();
                showToast('Password reset link sent if email exists.', 'info');
            });
        });
        //google and github button
    </script>

</body>
</html>
